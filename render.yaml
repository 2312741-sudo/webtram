services:
  - type: web
    name: webtram-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: webtram-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: tramdalat2026
      - key: ADMIN_SECRET
        value: tram_admin_secret_key_dalat_super_secure_2026
      - key: PORT
        value: 10000

databases:
  - name: webtram-db
    plan: free
    databaseName: webtram
    user: webtram_user
